[Basic]
	#进入主题梦境《灯影之下》时是否给予苍白骨针 默认：false
	"in lamp shadow give pale boneneedle" = false
	#初始生成世界时在0,0原点生成染梦裂隙 默认：false
	"the origin of the world initially generated dyedream crack " = false
	#启用模组进入游戏时的聊天栏公告 默认：true
	"mod accouocement" = true
	#禁止在使用染梦世界的染梦裂隙向主世界的返程传送 默认：false
	"no return dyedream crack" = false
	#在染梦世界生成初始出生点岛屿 默认：true
	"dyedream origin spawnpoint" = true
	#在与无名第三次对话后会被强制传送回主世界 默认：true
	"shadow npc third dialogue after tp player back to overworld" = true

["Custom Spawn"]
	#自定义出生维度/群系总开关（开启后，新玩家首次进入世界时会在指定维度与群系出生；关闭后按原版逻辑在主世界出生） 默认：false
	"custom spawn enabled" = false
	#自定义出生维度 ID（格式：命名空间:路径，如 minecraft:overworld / pasterdream:dyedream_world） 默认：minecraft:overworld
	"custom spawn dimension" = "minecraft:overworld"
	#自定义出生群系 ID（格式：命名空间:路径，如 minecraft:plains / pasterdream:dyedream） 默认：minecraft:plains
	"custom spawn biome" = "minecraft:plains"
	#出生群系搜索半径，单位：格（以目标维度出生点为中心向外搜索配置的群系；搜索不到时回退到维度出生点） 默认：10000 范围：100~100000
	# Default: 10000
	# Range: 100 ~ 100000
	"custom spawn search radius" = 10000

[property]
	#pasterdream玩家刻功能程序更新频率，算法：每-[此配置单位时间]-进行一次更新 单位/tick，过快的更新频率可能会影响性能，过慢的频率会让部分功能显得非常迟钝，推荐频率范围[2~20]整数  默认：5
	# Default: 5
	# Range: 2 ~ 20
	"player total tick update" = 5

[Sky]
	#星空枕(memento_item_08)在天空上可创建的连线星体数量上限 默认：8 范围：1~64
	# Default: 8
	# Range: 1 ~ 64
	"skylink max stars" = 8

["Meltdream Chest"]
	#融梦水晶箱自定义战利品总开关（开启后按下方三个品质的物品池生成掉落；关闭使用内置默认池） 默认：false
	"meltdream chest custom loot enabled" = false
	#融梦水晶箱普通品质物品池（每行一个条目，格式：物品ID 数量 权重，如 "pasterdream:fried_egg 2 30") 默认：内置普通物品池
